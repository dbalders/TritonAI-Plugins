name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [24.17.0, 26.12.1]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm readiness

  harness-contract:
    name: Harness contract (${{ matrix.channel }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: stable
            release: v0.4.1
            commit: ff37cf884c8679536b34fcff58a4616e1060ddb8
            node: 24.17.0
            pnpm: 11.10.0
          - channel: nightly
            release: v0.4.1-nightly.20261025.105
            commit: 5bd4bdcf28eefe6b9b3eee49f1e9864b4bc3f030
            node: 24.17.0
            pnpm: 11.10.0
          - channel: node26
            release: main
            commit: db2332607de14c61cf2235eedf0ccd8dc6f04f92
            node: 26.12.1
            pnpm: 12.14.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Maintainer-owned immutable host commits only. Never execute a caller-supplied host ref.
      - name: Checkout pinned Harness
        uses: actions/checkout@v4
        with:
          repository: dbalders/TritonAI-Harness
          ref: ${{ matrix.commit }}
          path: harness
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        id: host-pnpm
        with:
          version: ${{ matrix.pnpm }}
          package_json_file: harness/package.json
          dest: ~/setup-host-pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
          dest: ~/setup-plugins-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install contract dependencies without lifecycle scripts
        env:
          HOST_PNPM: ${{ steps.host-pnpm.outputs.bin_dest }}/pnpm
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          "$HOST_PNPM" --dir harness install --frozen-lockfile --ignore-scripts --filter t3...
      - name: Verify exact host contract
        env:
          TRITONAI_HARNESS_ROOT: ${{ github.workspace }}/harness
          TRITONAI_HARNESS_COMMIT: ${{ matrix.commit }}
        run: pnpm contract:harness
      - name: Record compatibility inputs
        if: always()
        env:
          HOST_CHANNEL: ${{ matrix.channel }}
          HOST_RELEASE: ${{ matrix.release }}
          HOST_COMMIT: ${{ matrix.commit }}
        run: |
          {
            echo "Plugin commit: $(git rev-parse HEAD)"
            echo "Harness channel: $HOST_CHANNEL"
            echo "Harness release: $HOST_RELEASE"
            echo "Expected Harness commit: $HOST_COMMIT"
            echo "Actual Harness commit: $(git -C harness rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"
